# getty@.service is Type=idle: systemd holds it until every queued boot job is
# dispatched, for up to 5 s. On the live ISO those jobs include
# systemd-time-wait-sync, which waits for NTP and never finishes offline or
# when the network's NTP server doesn't answer, so the installer on tty1 waits
# the full 5 s on most boots.
[Service]
Type=simple
